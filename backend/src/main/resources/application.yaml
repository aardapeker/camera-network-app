spring:
  application:
    name: backend

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  web:
    resources:
      static-locations: classpath:/

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        # Turn on to log the whole SMTP conversation when a send fails.
        debug: ${MAIL_DEBUG:false}
        transport:
          protocol: smtp
        smtp:
          auth: true
          # Port 587 uses STARTTLS; port 465 wants MAIL_SSL=true instead.
          starttls:
            enable: ${MAIL_STARTTLS:true}
          ssl:
            enable: ${MAIL_SSL:false}

  # Database Connection
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# Local file storage config
file:
  upload:
    dir: ./uploads
  base-url: ${FILE_BASE_URL:http://localhost:8080}

# OpenAI (Whisper speech-to-text + service form template drafting)
openai:
  api-key: ${OPENAI_API_KEY:}
  chat-model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}

frontend:
  base-url: ${FRONTEND_BASE_URL:http://localhost:5173}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:5173}

# Password for the bootstrap 'root' admin, used only on first start against an
# empty database. Leave empty to have a random one generated and printed to the log.
admin:
  initial-password: ${ADMIN_INITIAL_PASSWORD:}

# Sender identity on outgoing mail. Falls back to the SMTP username when unset.
mail:
  from: ${MAIL_FROM:}
  from-name: ${MAIL_FROM_NAME:}


jwt:
  secret: ${JWT_SECRET:}

# Raspberry Pi network scan ingestion
scan:
  api-key: ${SCAN_API_KEY:}
  default-retention-days: ${SCAN_DEFAULT_RETENTION_DAYS:30}
  default-min-write-interval-seconds: ${SCAN_DEFAULT_MIN_WRITE_INTERVAL_SECONDS:60}

# AWS S3 Backup Configuration
aws:
  s3:
    bucket: ${AWS_S3_BUCKET:fielddesk-backups}
    region: ${AWS_S3_REGION:eu-north-1}
    keep-last: ${AWS_S3_KEEP_LAST:30}
  credentials:
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}

# pg_dump path (adjust if postgres is not on PATH)
backup:
  pgdump:
    path: ${PGDUMP_PATH:pg_dump}

# Spring Boot Actuator - expose only health and metrics, lock down everything else
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
