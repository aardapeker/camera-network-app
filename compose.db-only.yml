# Database-only Docker Compose for local development
# Usage: docker compose -f compose.db-only.yml up -d
#
# This starts just PostgreSQL, then run frontend/backend locally:
#   - Backend: cd backend && ./mvnw spring-boot:run
#   - Frontend: cd frontend && npm run dev

services:
  db:
    image: postgres:17-alpine
    container_name: fielddesk-dev-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fielddesk_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_dev_data:
